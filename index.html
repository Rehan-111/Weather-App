<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        
        <div class="stars"></div>


        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="weather-app-img/images/search.png"></button>
        </div>
        <div class="weather">
            <img src="weather-app-img/images/rain.png" class="weather-icon">
            <h1 class="temp"></h1>
            <h2 class="city">Lucknow</h2>
            <div class="details">
                <div class="col">
                    <img src="weather-app-img/images/humidity.png">
                    <div>
                        <p class="humidity"></p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="weather-app-img/images/wind.png">
                    <div>
                        <p class="wind"></p>
                        <p>Wind Speed</p>
                    </div>
                </div>

            </div>

        </div>
    </div>
    <script>
    const apiKey= "a193f64bd72996631dffe34bd0f4fb48"
    const apiUrl= "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";


    const searchBox= document.querySelector(".search input");
    const searchBtn= document.querySelector(".search button");

    async function checkWeather(city){
        const response=await fetch(apiUrl + city + `&appid=${apiKey}`);
        var data= await response.json();

        if (data.cod !== 200){
            alert("city not found")
        }
        

        document.querySelector(".city").innerHTML=data.name;
        document.querySelector(".temp").innerHTML=Math.round(data.main.temp )+ "°C";
        document.querySelector(".humidity").innerHTML=data.main.humidity + "%";
        document.querySelector(".wind").innerHTML=data.wind.speed +"km/h";

        const weatherIcon = document.querySelector(".weather-icon");
        
        const card = document.querySelector(".card");

        const condition = data.weather[0].main.toLowerCase();

        // day/night detection
        const currentTime=data.dt;
        const sunrise=data.sys.sunrise;
        const sunset=data.sys.sunset;

        const isDay=currentTime>=sunrise&&currentTime<sunset
        
        const stars = document.querySelector(".stars");
        const body = document.body;

// // 🌙 Night mode
//         if (!isDay) {
//             body.style.background = "linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #000000)";
//         } 
// // ☀️ Day mode
//         else {
//             body.style.background = "linear-gradient(-45deg, #56ccf2, #2f80ed, #00c6ff, #0072ff)";
//         }

//         if (!isDay && condition === "clear") {
//             weatherIcon.style.filter = "drop-shadow(0 0 25px rgba(255,255,200,0.8))";
//         } else {
//             weatherIcon.style.filter = "drop-shadow(0 0 20px rgba(255,255,255,0.3))";
//         }

        // const hour = new Date().getHours();

        // if (hour >= 5 && hour <= 7) {
        //     body.style.background = "linear-gradient(-45deg, #ff9966, #ff5e62)";
        // }
        // if (hour >= 17 && hour <= 19) {
        //     body.style.background = "linear-gradient(-45deg, #ff7e5f, #feb47b)";
        // }

        // if (!isDay) {
        //     stars.style.opacity = "0.6"; // show stars
        // } else {
        //     stars.style.opacity = "0"; // hide stars
        // }

        //icon Logic
        if(condition==="clear"){
            weatherIcon.src=isDay
            ? "weather-app-img/images/clear.png"
            : "weather-app-img/images/night.png"
        }
        else if(condition==="clouds"){
            weatherIcon.src="weather-app-img/images/clouds.png"
        }
        else if (data.weather[0].main === "Clear") {
        weatherIcon.src = "weather-app-img/images/clear.png";
        } 
        else if (data.weather[0].main === "Rain") {
        weatherIcon.src = "weather-app-img/images/rain.png";
        }
         else if (data.weather[0].main === "Drizzle") {
        weatherIcon.src = "weather-app-img/images/drizzle.png";
        }
         else if (data.weather[0].main === "Mist") {
        weatherIcon.src = "weather-app-img/images/mist.png";
        }
        if (condition === "clear") {
             card.style.background = isDay
                ? "linear-gradient(135deg, #00feba, #5b548a)"   // day
                : "linear-gradient(135deg, #141E30, #243B55)"; // night
        }
        else if (condition === "rain") {
            card.style.background = "linear-gradient(135deg, #4e54c8, #8f94fb)";
        }
        else if (condition === "clouds") {
            card.style.background = "linear-gradient(135deg, #bdc3c7, #2c3e50)";
        }
        else if (condition === "mist") {
            card.style.background = "linear-gradient(135deg, #757f9a, #d7dde8)";
        }
    


        
    }
    searchBtn.addEventListener("click", ()=>{
        checkWeather(searchBox.value);
    })

    checkWeather("Delhi");
    </script>

    
</body>
</html>
